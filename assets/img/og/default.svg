<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1828"/>
      <stop offset="50%" stop-color="#1B2A4A"/>
      <stop offset="100%" stop-color="#253659"/>
    </linearGradient>
    <linearGradient id="gold-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C9973A" stop-opacity="0"/>
      <stop offset="30%" stop-color="#C9973A"/>
      <stop offset="70%" stop-color="#C9973A"/>
      <stop offset="100%" stop-color="#C9973A" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Dot pattern overlay -->
  <rect width="1200" height="630" fill="none" opacity="0.4">
    <pattern id="dots" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="15" cy="15" r="1" fill="white" opacity="0.08"/>
    </pattern>
    <rect width="1200" height="630" fill="url(#dots)"/>
  </rect>
  <!-- Gold accent lines -->
  <line x1="80" y1="1" x2="80" y2="629" stroke="#C9973A" stroke-width="2" opacity="0.15"/>
  <line x1="1120" y1="1" x2="1120" y2="629" stroke="#C9973A" stroke-width="2" opacity="0.15"/>
  <rect x="80" y="1" width="1040" height="628" stroke="#C9973A" stroke-width="1" fill="none" opacity="0.1"/>
  <!-- Bottom gold rule -->
  <rect x="80" y="600" width="1040" height="1.5" fill="url(#gold-line)" opacity="0.6"/>
  <!-- Monogram -->
  <text x="600" y="200" font-family="Georgia, serif" font-size="140" font-weight="700" fill="white" opacity="0.06" text-anchor="middle" letter-spacing="-4">HF</text>
  <!-- Site name -->
  <text x="600" y="285" font-family="Georgia, serif" font-size="72" font-weight="700" fill="#F8F4EE" text-anchor="middle" letter-spacing="-1">Hoteles Famosos</text>
  <!-- Gold divider -->
  <rect x="520" y="308" width="160" height="2" fill="#C9973A" rx="1"/>
  <!-- Tagline -->
  <text x="600" y="360" font-family="Georgia, serif" font-size="28" font-style="italic" fill="#C9973A" text-anchor="middle" opacity="0.9">La Bitácora de los Grandes Hoteles</text>
  <!-- Sub descriptor -->
  <text x="600" y="430" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#F8F4EE" text-anchor="middle" opacity="0.5" letter-spacing="3">GUÍA EDITORIAL · ESPAÑOL · HOTELESFAMOSOS.COM</text>
</svg>
